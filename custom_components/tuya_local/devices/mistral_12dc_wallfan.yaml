name: Wall fan
products:
  - id: nrofdlepsrw8jxy0
    manufacturer: Mistral
    model: 12" DC High Velocity Wall Fan
entities:
  - entity: fan
    translation_only_key: fan_with_presets
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: circulation
            value: circulation
          - dps_val: normal
            value: normal
          - dps_val: sleep
            value: sleep
      - id: 3
        type: integer
        name: speed
        range:
          min: 1
          max: 12
      - id: 5
        type: boolean
        name: oscillate
  - entity: switch
    name: Vertical oscillation
    icon: "mdi:pan-vertical"
    category: config
    dps:
      - id: 4
        type: boolean
        name: switch
  - entity: switch
    translation_key: motion_detection
    category: config
    dps:
      - id: 101
        type: boolean
        name: switch
  - entity: light
    dps:
      - id: 15
        type: boolean
        name: switch
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 22
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: "7h"
            value: "7h"
          - dps_val: "8h"
            value: "8h"
          - dps_val: "9h"
            value: "9h"
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 23
        type: integer
        name: sensor
        unit: min
